name: Validate Next.js app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        url-prefix: ['', NewTab]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --include=dev --audit-level=low
      - run: npm run lint
      - run: npm run build
        env:
          URL_PREFIX: ${{ matrix.url-prefix }}
